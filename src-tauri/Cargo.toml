[package]
name = "myshelltool"
version = "0.6.0"
edition = "2021"
# v1.4：MCP server 内嵌 GUI 进程（Streamable HTTP transport），不再有独立 mcp binary。
# cargo run / tauri dev 跑 GUI，MCP server 随 GUI setup 经 tauri::async_runtime::spawn 拉起。
default-run = "myshelltool"

[lib]
name = "myshelltool_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
myshelltool-core = { path = "../crates/myshelltool-core" }
serde = { version = "1", features = ["derive"] }
russh = "0.49"
tokio = { version = "1", features = ["sync", "parking_lot", "io-util", "rt-multi-thread", "net", "macros", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
serde_json = "1"
russh-sftp = "2"
log = { version = "0.4", features = ["std"] }

# MCP server 接入（D3 锁定 rmcp ~1.7，MCP 协议 2025-06-18 基线）
# v1.1：加 elicitation feature（高危命令客户端内确认）+ schemars（elicit<T> 泛型版需要）
# v1.4：加 transport-streamable-http-server（MCP 内嵌 GUI，Streamable HTTP transport）
rmcp = { version = "~1.7", features = ["server", "transport-io", "transport-streamable-http-server", "elicitation", "schemars"] }
# 危险命令检测（D5：翻译 dangerousCommands.js，GUI 与 MCP 共享）
regex = "1"
# MCP v1.1 elicitation：elicit::<T>() 需要 schemars 直接依赖（生成 JSON Schema）
schemars = "1"
# 日志时间戳（FileLogger 的 [YYYY-MM-DD HH:MM:SS] 前缀）
chrono = "0.4"
# v1.4 MCP 内嵌 GUI：Streamable HTTP transport 的 web 框架（rmcp 官方示例同款）
axum = "0.8"
# v1.4 MCP HTTP server 的 CancellationToken（优雅关停）
tokio-util = "0.7"
# v1.3 Gist 同步：HTTP 客户端调 GitHub Gist API
# 用 native-tls（Windows SChannel）而非 rustls-tls：rustls 拉 ring，ring 需 gcc 编译 C，
# 而 mingw gcc 在被 cargo spawn 时 cc1 解析失败。native-tls 零 C 编译，绕开整个工具链问题。
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# 剪贴板插件（v2 原生 clipboard，替代 v1 的 window.__TAURI__.clipboard 注入——
# navigator.clipboard 在 Tauri v2 webview 非聚焦时不稳，走原生插件最可靠）
tauri-plugin-clipboard-manager = "2"
# 外链打开插件（v1.6 同步面板「打开 GitHub Token 设置页」按钮直达系统浏览器）
# Tauri v2 官方推荐，比 shell open 更轻量、权限更收敛。
tauri-plugin-opener = "2"
# 应用内自动更新（v1.7 发版）：检查 GitHub Release 的 latest.json + 校验签名 + 下载安装。
# NSIS 安装包在 CI 用 TAURI_SIGNING_PRIVATE_KEY 签名，私钥存 GitHub Secrets 不入仓库。
tauri-plugin-updater = "2"
# v1.3 Gist 同步 save_session_key 生成随机 salt（与 core 同版本 0.8，避免依赖分裂）。
rand = "0.8"

# Windows-only：凭据存储 DPAPI 加密（v1.3 SecretStore 升级）。
# SecretCodec trait 在 core 层，DPAPI 实现在此（cfg(windows)）。
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.1"
