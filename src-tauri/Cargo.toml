[package]
name = "myshelltool"
version = "0.1.0"
edition = "2021"

[lib]
name = "myshelltool_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
myshelltool-core = { path = "../crates/myshelltool-core" }
serde = { version = "1", features = ["derive"] }
russh = "0.49"
tokio = { version = "1", features = ["sync", "parking_lot", "io-util", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
serde_json = "1"
russh-sftp = "2"
log = { version = "0.4", features = ["std"] }
