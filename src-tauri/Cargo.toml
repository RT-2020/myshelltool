[package]
name = "myshelltool"
version = "0.3.0"
edition = "2021"
# 双二进制（D1）：cargo run / tauri dev 默认跑 GUI，
# myshelltool-mcp 由 src/bin/mcp.rs 独立构建（console 子系统）。
default-run = "myshelltool"

[lib]
name = "myshelltool_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
myshelltool-core = { path = "../crates/myshelltool-core" }
serde = { version = "1", features = ["derive"] }
russh = "0.49"
tokio = { version = "1", features = ["sync", "parking_lot", "io-util", "rt-multi-thread", "net", "macros", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
serde_json = "1"
russh-sftp = "2"
log = { version = "0.4", features = ["std"] }

# MCP server 接入（D3 锁定 rmcp ~1.7，MCP 协议 2025-06-18 基线）
# v1.1：加 elicitation feature（高危命令客户端内确认）+ schemars（elicit<T> 泛型版需要）
rmcp = { version = "~1.7", features = ["server", "transport-io", "elicitation", "schemars"] }
# 危险命令检测（D5：翻译 dangerousCommands.js，GUI 与 MCP 共享）
regex = "1"
# MCP v1.1 elicitation：elicit::<T>() 需要 schemars 直接依赖（生成 JSON Schema）
schemars = "1"
# 日志时间戳（FileLogger 的 [YYYY-MM-DD HH:MM:SS] 前缀）
chrono = "0.4"

# MCP server 独立 bin（D1 双二进制：GUI + console 子系统 MCP）
[[bin]]
name = "myshelltool-mcp"
path = "src/bin/mcp.rs"

# Windows-only：凭据存储 DPAPI 加密（v1.3 SecretStore 升级）。
# SecretCodec trait 在 core 层，DPAPI 实现在此（cfg(windows)）。
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.1"
