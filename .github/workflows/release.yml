# 发版自动发布（v1.7）：推送 v* tag → 构建 NSIS + 便携 zip → 发布 GitHub Release。
#
# 触发：git tag v0.5.0 && git push --tags
# 产物：
#   - myshelltool_<ver>_x64-setup.exe      NSIS 安装包（已用 TAURI_SIGNING_PRIVATE_KEY 签名）
#   - myshelltool_<ver>_x64-setup.exe.sig  签名文件（Tauri updater 校验用）
#   - myshelltool-<ver>-portable.zip       便携版（exe + 4 个 MinGW runtime DLL）
#   - latest.json                          Tauri updater 元数据（endpoints 指向此文件）
#
# 前置（仅需配置一次）：仓库 Settings → Secrets → Actions 添加：
#   - TAURI_SIGNING_PRIVATE_KEY          = 本地 `tauri signer generate` 生成的私钥
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 生成私钥时设置的密码
# 公钥需填入 src-tauri/tauri.conf.json 的 plugins.updater.pubkey。

name: Release

on:
  push:
    tags:
      - 'v*'

# 同 tag 重推时覆盖旧 Release（避免卡在已存在的 tag）。
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gen-changelog 需要 git log 全历史 + 全部 tags（git describe --tags 依赖），
          # 默认 fetch-depth 1 拿不到上个 tag，发布说明会生成失败。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 一致：Vite 7 要求 Node ^20.19.0 || >=22.12.0，Node 20 已 EOL。
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: npm ci

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 防「忘 bump 就打 tag」：tag 名与两处 manifest 版本不一致时当场失败，
      # 否则会发出名为 v0.12.0、内容 0.11.0 的 release 且 updater latest.json 版本混乱。
      - name: Verify tag matches manifest versions
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          pkg_ver=$(node -p "require('./package.json').version")
          tauri_ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=${tag_ver} package.json=${pkg_ver} tauri.conf.json=${tauri_ver}"
          if [ "$tag_ver" != "$pkg_ver" ] || [ "$tag_ver" != "$tauri_ver" ]; then
            echo "::error::版本不一致：tag(${tag_ver}) vs package.json(${pkg_ver}) vs tauri.conf.json(${tauri_ver})——先 bump 版本再打 tag。"
            exit 1
          fi

      - name: Build (Tauri NSIS + updater signature)
        env:
          # Tauri 检测到这两个环境变量会自动对 NSIS 安装包签名并产出 .sig。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Package portable zip
        shell: pwsh
        run: |
          # 便携包 = 编译产物 exe + bundle.resources 声明的 4 个 MinGW runtime DLL。
          # DLL 已提交在 src-tauri/ 根目录，与 exe 同级运行所需。
          $staging = "portable-staging"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "src-tauri/target/release/myshelltool.exe" $staging
          Copy-Item "src-tauri/WebView2Loader.dll" $staging
          Copy-Item "src-tauri/libgcc_s_seh-1.dll" $staging
          Copy-Item "src-tauri/libstdc++-6.dll" $staging
          Copy-Item "src-tauri/libwinpthread-1.dll" $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "myshelltool-${{ steps.ver.outputs.version }}-portable.zip" -Force

      - name: Locate bundle artifacts
        id: artifacts
        shell: pwsh
        run: |
          # NSIS 产物在 src-tauri/target/release/bundle/nsis/，文件名含版本号。
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setup = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "未找到 NSIS setup.exe，构建可能失败" }
          $sig = Get-ChildItem "$nsisDir/*-setup.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          # latest.json：优先用 Tauri build 自动生成的；缺失则从 setup + sig 现场生成。
          # （Tauri 2 在配了 updater + 签名密钥时会自动产 latest.json；这里兜底防御。）
          $latest = "src-tauri/target/release/bundle/nsis/latest.json"
          if (-not (Test-Path $latest)) {
            if (-not $sig) { throw "未找到 .sig 签名文件——请确认已配置 TAURI_SIGNING_PRIVATE_KEY secret" }
            $v = "${{ steps.ver.outputs.version }}"
            $sigContent = (Get-Content $sig.FullName -Raw).Trim()
            $url = "https://github.com/RT-2020/myshelltool/releases/latest/download/$($setup.Name)"
            # 若 release-notes.md 已生成（步骤顺序调整时兜底），优先注入真实说明。
            $notes = "myshelltool $v"
            if (Test-Path "release-notes.md") { $notes = (Get-Content "release-notes.md" -Raw).Trim() }
            $manifest = @{
              version = $v
              notes = $notes
              pub_date = (Get-Date).ToUniversalTime().ToString("o")
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sigContent
                  url = $url
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 10 | Set-Content $latest -Encoding UTF8
          }
          echo "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          echo "sig=$($sig.FullName)" >> $env:GITHUB_OUTPUT
          echo "latest=$latest" >> $env:GITHUB_OUTPUT

      # 生成结构化中文发布说明（feat/fix 分组）。失败即中止 workflow——
      # 静默发一个无说明的版本正是本链路要修的 bug，不加 || true 兜底。
      # 注：gen-changelog.mjs 的 --for 曾因 `git describe <tag>^` 在 Windows 经
      # cmd.exe 执行丢 ^ 转义符而算错区间，已修复（改用 `~1` 父提交语法）。
      # 此处仍保留 bash 显式解析上个 tag + --from/--to 传参的写法：echo 出
      # 「notes range: A -> B」便于排查区间错误（日志透明），改回 --for 也可以。
      - name: Generate release notes
        shell: bash
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")
          echo "notes range: ${prev_tag} -> ${GITHUB_REF_NAME}"
          node scripts/gen-changelog.mjs --from "$prev_tag" --to "$GITHUB_REF_NAME" -o release-notes.md

      # 把 release-notes.md 注入 latest.json 的 notes 字段（Tauri updater 前端
      # update.body 读的就是它）。node 读写在 Windows 上保证 UTF-8 无 BOM、
      # JSON 仍可解析；strip BOM 是防上面 pwsh 兜底路径（UTF8 带 BOM）。
      - name: Inject notes into latest.json
        shell: bash
        env:
          LATEST_JSON: ${{ steps.artifacts.outputs.latest }}
        run: |
          node -e '
            const fs = require("fs");
            const notes = fs.readFileSync("release-notes.md", "utf8").trim();
            if (!notes) { console.error("release-notes.md 为空，拒绝注入空说明"); process.exit(1); }
            const path = process.env.LATEST_JSON;
            const raw = fs.readFileSync(path, "utf8").replace(/^\uFEFF/, "");
            const manifest = JSON.parse(raw);
            manifest.notes = notes;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n", "utf8");
            console.log("notes 已注入", path, "（长度", notes.length, "）");
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Release body 与 latest.json notes 同源（gen-changelog 产物）——
          # 不用 GitHub 默认 generate_release_notes（英文 PR 平铺，与中文分组说明重复且可读性差）。
          body_path: release-notes.md
          files: |
            ${{ steps.artifacts.outputs.setup }}
            ${{ steps.artifacts.outputs.sig }}
            myshelltool-${{ steps.ver.outputs.version }}-portable.zip
            ${{ steps.artifacts.outputs.latest }}
