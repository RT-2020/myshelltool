# 构建守护（v1.7）：push master / PR 时验证「构建没坏」，不产出安装包。
#
# 比 release.yml 轻量很多——只跑前端编译检查 + Rust 类型检查 + core 单测，
# 把破坏挡在发版之前。完整 Tauri 打包只在 tag 触发的 release.yml 跑。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 7 engines 要求 ^20.19.0 || >=22.12.0，且 Node 20 已 EOL；
          # 用 22 与本地 24 同处兼容区间，避免浮动 20.x 恰好命中过旧小版本。
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          # test:core 用 --manifest-path 跑，其 target 在 core 自己目录下，
          # 不补这一行则 core 的编译产物从未被缓存（每次 CI 全量重编）。
          workspaces: |
            src-tauri -> target
            crates/myshelltool-core -> crates/myshelltool-core/target

      - name: Install JS deps
        run: npm ci

      - name: Frontend build (Vite)
        run: npm run build

      - name: Rust type check (cargo check)
        working-directory: src-tauri
        run: cargo check

      - name: Core unit tests
        run: npm run test:core
