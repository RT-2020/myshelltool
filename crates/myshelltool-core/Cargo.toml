[package]
name = "myshelltool-core"
version = "0.6.1"
edition = "2021"

[lib]
name = "myshelltool_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v1.3 Gist 同步加密内核：主密码 Argon2 派生密钥 + AES-256-GCM 认证加密
aes-gcm = "0.10"
argon2 = "0.5"
# 加密所需的 CSPRNG（生成 salt / AES-GCM nonce）
rand = "0.8"
